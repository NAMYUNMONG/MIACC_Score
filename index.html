<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>콘티 제작 도우미</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="container">
    <h1>콘티 제작 도우미</h1>
    <p class="subtitle">여러 곡의 섹션 흐름을 편집하고 A4 세로 PDF로 내보내기</p>

    <section class="panel">
      <h2>곡 추가</h2>
      <div class="row">
        <input id="songTitle" type="text" placeholder="곡 제목 (예: Amazing Grace)" />
        <input id="reference" type="text" placeholder="레퍼런스(연주자/버전)" />
        <input id="key" type="text" placeholder="조성 (예: G maj)" />
        <button id="addSongBtn">곡 추가</button>
      </div>
    </section>

    <section class="panel">
      <h2>곡 목록</h2>
      <div id="songs"></div>
      <div class="actions">
        <button id="exportBtn" class="primary">A4 세로 PDF 내보내기</button>
      </div>
    </section>
  </main>

  <template id="songTemplate">
    <article class="song-card">
      <header>
        <div>
          <h3 class="song-title"></h3>
          <p class="song-meta"></p>
        </div>
        <button class="remove-btn">삭제</button>
      </header>

      <div class="music-sheet-area">
        <label>악보(이미지) 업로드</label>
        <input type="file" class="sheet-input" accept="image/*" />
        <div class="sheet-preview-wrap">
          <img class="sheet-preview" alt="악보 미리보기" />
        </div>
      </div>

      <div class="section-editor">
        <p>섹션 토글:</p>
        <div class="chips"></div>
        <label>흐름(순서) 편집 (드래그 대신 클릭 추가 방식)</label>
        <div class="sequence-builder">
          <select class="section-picker"></select>
          <button class="add-sequence">흐름에 추가</button>
          <button class="clear-sequence">흐름 초기화</button>
        </div>
        <p class="sequence-output">흐름: -</p>
      </div>

      <div class="requests">
        <label>특별 요청사항</label>
        <textarea class="request-text" rows="3" placeholder="예: 2절 후 바로 후렴, 드럼 브러쉬 사용"></textarea>
      </div>
    </article>
  </template>
</body>
</html>
